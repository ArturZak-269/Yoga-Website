<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">

  <!-- Subtle outer ring -->
  <circle cx="40" cy="40" r="36" stroke="#6B8F6F" stroke-width="0.8" opacity="0.22"/>

  <!-- Back petals — lightest sage -->
  <path d="M40 58 C22 53 10 39 16 22 C19 12 30 8 40 12 Z"
        fill="#A8C5AC" opacity="0.58"/>
  <path d="M40 58 C58 53 70 39 64 22 C61 12 50 8 40 12 Z"
        fill="#A8C5AC" opacity="0.58"/>

  <!-- Middle petals — sage green -->
  <path d="M40 58 C20 52 10 34 18 16 C23 6 34 4 40 7 Z"
        fill="#6B8F6F" opacity="0.68"/>
  <path d="M40 58 C60 52 70 34 62 16 C57 6 46 4 40 7 Z"
        fill="#6B8F6F" opacity="0.68"/>

  <!-- Centre petal — full sage -->
  <path d="M40 60 C36 44 36 26 40 4 C44 26 44 44 40 60 Z"
        fill="#6B8F6F"/>

  <!-- Gold centre — ring + dot -->
  <circle cx="40" cy="53" r="5.5" stroke="#C9A96E" stroke-width="1.3" opacity="0.8"/>
  <circle cx="40" cy="53" r="2.5" fill="#C9A96E" opacity="0.95"/>

  <!-- Gold dewdrops on side petals -->
  <circle cx="25" cy="37" r="1.5" fill="#C9A96E" opacity="0.55"/>
  <circle cx="55" cy="37" r="1.5" fill="#C9A96E" opacity="0.55"/>

  <!-- Stem -->
  <line x1="40" y1="60" x2="40" y2="68"
        stroke="#6B8F6F" stroke-width="2" stroke-linecap="round"/>

  <!-- Water ripple — gold -->
  <path d="M27 68 Q40 64 53 68"
        stroke="#C9A96E" stroke-width="1.5" fill="none" stroke-linecap="round"/>

</svg>
