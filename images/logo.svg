<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e8c870"/>
      <stop offset="100%" stop-color="#a07828"/>
    </linearGradient>
  </defs>

  <!--
    Modern 3-petal lotus bud.
    All petals share the base point (28, 33).
    Strokes only; barely-there fills; lots of negative space.
  -->

  <!-- Far-left petal  (–42°) -->
  <g transform="translate(28 33) rotate(-42)">
    <path d="M0 0 C-2.4 -2.2 -2.8 -8 0 -14
             C2.8 -8 2.4 -2.2 0 0Z"
          fill="#6B8F6F" fill-opacity="0.06"
          stroke="#6B8F6F" stroke-width="1.0"
          stroke-linejoin="round"/>
  </g>

  <!-- Far-right petal (+42°) -->
  <g transform="translate(28 33) rotate(42)">
    <path d="M0 0 C-2.4 -2.2 -2.8 -8 0 -14
             C2.8 -8 2.4 -2.2 0 0Z"
          fill="#6B8F6F" fill-opacity="0.06"
          stroke="#6B8F6F" stroke-width="1.0"
          stroke-linejoin="round"/>
  </g>

  <!-- Centre petal — tallest, slightly wider -->
  <g transform="translate(28 33)">
    <path d="M0 0 C-3.2 -3.5 -3.6 -11 0 -19
             C3.6 -11 3.2 -3.5 0 0Z"
          fill="#6B8F6F" fill-opacity="0.10"
          stroke="#6B8F6F" stroke-width="1.1"
          stroke-linejoin="round"/>
  </g>

  <!-- Delicate horizontal water line -->
  <path d="M16 37 Q22 35.5 28 37 Q34 38.5 40 37"
        stroke="#6B8F6F" stroke-width="0.75"
        stroke-linecap="round" opacity="0.38"/>

  <!-- Gold centre ring -->
  <circle cx="28" cy="33" r="2.8"
          stroke="url(#gd)" stroke-width="0.9" opacity="0.9"/>

  <!-- Gold centre dot -->
  <circle cx="28" cy="33" r="1.1" fill="#C9A96E"/>

</svg>
